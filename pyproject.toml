[project]
name = "mlst-scheme-evaluation"
version = "0.1.0"
description = "Evaluate MLST schemes in marimo notebooks"
readme = "README.md"
license = "EUPL-1.2"
requires-python = ">=3.14,<3.15"
dependencies = [
  "altair>=5.4.0",
  "duckdb>=1.0.0",
  "marimo>=0.25.1,<0.26",
  "nbformat>=5.7.0",
  "openai>=1.55.3",
  "polars>=1.9.0",
  "pyarrow",
  "ruff",
  "sqlglotc>=30.11.0",
  "vegafusion>=2.0.0",
  "vl-convert-python>=1.0.0",
]

[tool.mlst_scheme_evaluation.conda]
channels = ["conda-forge", "bioconda", "nodefaults"]
dependencies = ["conda-forge::mafft", "bioconda::blast"]
