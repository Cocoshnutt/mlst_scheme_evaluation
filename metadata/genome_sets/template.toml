# Add one table per assembly. Version assembly accessions where possible.
# `local_path` is relative to this manifest file, or absolute when runtime data
# are managed elsewhere. Do not commit assemblies unless their redistribution
# terms permit it. Quality fields may be omitted when genuinely unavailable.
#
# [[genomes]]
# genome_id = "example-genome-1"
# scientific_name = "Genus species"
# taxonomy_identifier = "NCBITaxon:12345"
# assembly_accession = "GCF_000000000.1"
# source_url = "https://..."
# retrieved_date = "YYYY-MM-DD"
# local_path = "../../data/genomes/example-genome-1.fna.gz"
# sha256 = "64-character hexadecimal digest"
# assembly_level = "Complete Genome"
# contig_count = 1
# total_length_bp = 0
# n50_bp = 0
# completeness_percentage = 0.0
# contamination_percentage = 0.0
# lineage = "TODO or unknown with explanation"
# inclusion_rationale = "Why this genome represents the evaluation scope"
# source_license = "Source terms or unknown"
# source_citation = "DOI, PMID, or recommended citation"
# notes = "Additional provenance, transformations, or limitations"
